spring:
  application:
    name: collector
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8080

collector:
  kafka:
    topics:
      sensor-events: telemetry.sensors.v1
      hub-events: telemetry.hubs.v1
