spring:
  application:
    name: analyzer
  datasource:
    url: jdbc:h2:file:./telemetry/analyzer/analyzer-db;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

analyzer:
  kafka:
    bootstrap-servers:
      - localhost:9092
    poll-timeout: 5s
    hub-consumer:
      group-id: analyzer-hub-events
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
    snapshot-consumer:
      group-id: analyzer-snapshots
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
    topics:
      hub-events: telemetry.hubs.v1
      snapshots: telemetry.snapshots.v1
