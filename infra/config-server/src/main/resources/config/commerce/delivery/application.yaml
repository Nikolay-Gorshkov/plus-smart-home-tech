server:
  port: 0

spring:
  application:
    name: delivery
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_home_tech}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: delivery_service
  sql:
    init:
      mode: always

delivery:
  base-cost: 5.0
  fragile-factor: 0.2
  weight-factor: 0.3
  volume-factor: 0.2
  street-factor: 0.2

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
