spring:
  application:
    name: collector

eureka:
  instance:
    instance-id: ${spring.application.name}:${grpc.server.port}
    non-secure-port: ${grpc.server.port}
    metadata-map:
      grpc.port: ${grpc.server.port}

grpc:
  server:
    port: 59091

collector:
  kafka:
    bootstrap-servers:
      - localhost:9092
    producer:
      acks: all
      enable-idempotence: true
    topics:
      sensor-events: telemetry.sensors.v1
      hub-events: telemetry.hubs.v1
