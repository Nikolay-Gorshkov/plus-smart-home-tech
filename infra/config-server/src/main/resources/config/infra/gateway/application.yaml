server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: shopping-cart-service-route
          uri: lb://shopping-cart
          predicates:
            - Path=/shopping-cart,/shopping-cart/**
          filters:
            - PrefixPath=/api/v1
        - id: shopping-store-service-route
          uri: lb://shopping-store
          predicates:
            - Path=/shopping-store,/shopping-store/**
          filters:
            - PrefixPath=/api/v1
            - name: Retry
              args:
                retries: 3
                statuses:
                  - NOT_FOUND
                methods:
                  - GET
